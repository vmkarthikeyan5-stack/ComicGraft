<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComicGraft - AI Comic Story Creator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 500;
      color: #2f81f7;
      border: 1px solid #2f81f7;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #ffffff;
    }

    p.description {
      color: #8b949e;
      font-size: 1.1rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .meta-info {
      border-top: 1px solid #30363d;
      padding-top: 16px;
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #8b949e;
    }

    .meta-info span {
      color: #c9d1d9;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Public Repository</span>
    <h1>ComicGraft</h1>
    <p class="description">AI Comic Story Creator using Gemini Models</p>
    
    <div class="meta-info">
      <div>Owner: <span>vmkarthikeyan5-stack</span></div>
      <div>Commit: <span>c45ef4f</span></div>
    </div>
  </div>

</body>
</html>
